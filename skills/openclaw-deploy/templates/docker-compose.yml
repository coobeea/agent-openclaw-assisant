version: '3.8'

services:
  openclaw:
    build: .
    container_name: ${INSTANCE_ID:-openclaw-prod-01}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${WORKSPACE_PATH}:/workspace
    environment:
      - OPENCLAW_LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
