[project]
name = "agent-openclaw-assistant"
version = "1.0.0"
description = "OpenClaw 管理技能包集合 - 为 Cursor IDE 打造的 OpenClaw 管理助手"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "lifeng", email = "lifeng@example.com"}
]
keywords = ["openclaw", "ai-assistant", "cursor", "skills"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # 配置文件解析
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    
    # 命令行工具
    "click>=8.1.7",
    "rich>=13.7.0",
    
    # 加密和安全
    "cryptography>=41.0.7",
    
    # HTTP 客户端
    "requests>=2.31.0",
    "httpx>=0.25.2",
    
    # 进程管理
    "psutil>=5.9.6",
    
    # 日志管理
    "colorlog>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
]

ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]

docs = [
    "python-docx>=0.8.11",
    "pdfplumber>=0.10.0",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/openclaw/agent-openclaw-assistant"
Documentation = "https://github.com/openclaw/agent-openclaw-assistant/docs"
Repository = "https://github.com/openclaw/agent-openclaw-assistant"
Issues = "https://github.com/openclaw/agent-openclaw-assistant/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["skills"]
omit = ["*/tests/*", "*/test_*.py"]
