# Scheduler 可配置内核部署配置
# 支持 OpenClaw 和 QwenPaw 双内核

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: openclaw
data:
  # 内核类型配置（全局默认）
  # 可选值: "openclaw" | "qwenpaw"
  KERNEL_TYPE: "openclaw"
  
  # OpenClaw 内核配置
  KERNEL_OPENCLAW_AUTH_TOKEN: "openclaw-internal-k8s-token"
  
  # QwenPaw 内核配置（如果使用 QwenPaw）
  KERNEL_QWENPAW_AUTH_TOKEN: ""  # 留空表示无认证
  
  # 数据库配置
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "openclaw123"
  POSTGRES_DB: "openclaw"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-scheduler
  namespace: openclaw
  labels:
    app: openclaw-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-scheduler
  template:
    metadata:
      labels:
        app: openclaw-scheduler
    spec:
      containers:
      - name: scheduler
        image: scheduler-go:configurable-kernel
        imagePullPolicy: Never  # 使用本地镜像
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: scheduler-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-scheduler
  namespace: openclaw
spec:
  type: NodePort
  selector:
    app: openclaw-scheduler
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080  # 外部访问端口

---
# 水平自动扩缩容（可选）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openclaw-scheduler-hpa
  namespace: openclaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openclaw-scheduler
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
