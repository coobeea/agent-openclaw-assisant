apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-scheduler
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-scheduler-role
  namespace: openclaw
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-scheduler-binding
  namespace: openclaw
subjects:
- kind: ServiceAccount
  name: openclaw-scheduler
roleRef:
  kind: Role
  name: openclaw-scheduler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-scheduler
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-scheduler
  template:
    metadata:
      labels:
        app: openclaw-scheduler
    spec:
      serviceAccountName: openclaw-scheduler
      containers:
      - name: scheduler
        image: openclaw-scheduler-go:streamfix
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "openclaw"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "openclaw123"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        volumeMounts:
        - name: agents-workspace
          mountPath: /data/agents
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: agents-workspace
        hostPath:
          path: /Users/lifeng/git/git-claw/agent-openclaw-assisant/workspace/lobsters/agents
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-scheduler
  namespace: openclaw
spec:
  type: NodePort
  selector:
    app: openclaw-scheduler
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080
