# 使用 hostPath 直接映射到宿主机
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: openclaw
data:
  POSTGRES_DB: openclaw
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: openclaw123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-storage
        hostPath:
          path: /Users/lifeng/git/git-claw/agent-openclaw-assisant/workspace/lobsters/database
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openclaw
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
